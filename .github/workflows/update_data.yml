name: Update Dashboard Data

on:
  schedule:
    # 4 janelas independentes por hora para contornar descartes da fila do GitHub Actions.
    # O extract_metrics.js possui trava interna de 50 min para só consultar o Mixpanel 1x por hora.
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'
  workflow_dispatch: # Permite execução manual imediata ignorando a trava de 50 min

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run extraction script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node extract_metrics.js --force
          else
            node extract_metrics.js
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update mixpanel data"
            git pull --rebase origin main
            git push
          else
            echo "Sem alterações no dashboard_data.json (trava de 50 min ativa)."
          fi
