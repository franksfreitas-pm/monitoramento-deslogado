name: Update Dashboard Data

on:
  schedule:
    - cron: '0 * * * *' # Executa de hora em hora
  workflow_dispatch: # Permite execução manual pelo painel do GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run extraction script
        run: node extract_metrics.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json
          git commit -m "chore: auto-update mixpanel data" || echo "No changes to commit"
          git push
